[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Native desktop shell for DeepSeek Harness"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
libc = "0.2"
sha2 = "0.10"
hmac = "0.12"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
