<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness Desktop</title>
    <style>
      :root {
        --brand: #4d6bfe;
        --bg: #16171d;
        --fg: #e6e7ea;
        --muted: #8b8f9a;
        --danger: #ff6b6b;
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--fg);
        font: 14px/1.6 -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC",
          system-ui, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-user-select: none;
        user-select: none;
      }
      main {
        width: min(520px, 82vw);
        text-align: center;
      }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 22px;
      }
      .mark img {
        display: block;
        width: 100%;
        height: 100%;
      }
      h1 {
        margin: 0 0 6px;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }
      .status {
        margin: 0;
        color: var(--muted);
        font-size: 13px;
        min-height: 1.6em;
      }
      .bar {
        margin: 20px auto 0;
        width: 180px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.08);
        overflow: hidden;
      }
      .bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: var(--brand);
        animation: slide 1.15s ease-in-out infinite;
      }
      @keyframes slide {
        0% {
          transform: translateX(-100%);
        }
        100% {
          transform: translateX(350%);
        }
      }
      .detail {
        margin: 22px auto 0;
        max-height: 34vh;
        overflow: auto;
        text-align: left;
        white-space: pre-wrap;
        word-break: break-word;
        font: 12px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.07);
        border-radius: 8px;
        padding: 12px 14px;
        display: none;
        -webkit-user-select: text;
        user-select: text;
      }
      .detail.on {
        display: block;
      }
      /* The mark is the app icon now, with no plate of its own to recolour, so
         the failure state dims it and lets the red message carry the signal. */
      .failed .mark {
        opacity: 0.45;
        filter: grayscale(1);
      }
      .failed .bar {
        display: none;
      }
      .failed .status {
        color: var(--fg);
      }
      .hint {
        margin: 14px 0 0;
        color: var(--muted);
        font-size: 12px;
        display: none;
      }
      .failed .hint {
        display: block;
      }
      kbd {
        font: inherit;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <main id="root">
      <div class="mark">
        <!-- The app icon itself, so the boot screen cannot drift away from the
             icon the Dock shows. Copied into ui/ because only this directory is
             served to the webview. -->
        <img src="icon.png" alt="" />
      </div>
      <h1>DeepSeek Harness Desktop</h1>
      <p class="status" id="status">正在启动 Harness…</p>
      <div class="bar"><span></span></div>
      <pre class="detail" id="detail"></pre>
      <p class="hint">
        按 <kbd>⌘⇧R</kbd> 重试，或检查 <code>~/.dsh</code> 下的配置。
      </p>
    </main>

    <script>
      const root = document.getElementById("root");
      const status = document.getElementById("status");
      const detail = document.getElementById("detail");
      // The shell has no progress to report: the harness announces its URL once,
      // at the very end. Show the only thing actually known — how long we have
      // been waiting — rather than narrating stages nobody reported.
      const started = Date.now();
      const timer = setInterval(() => {
        const seconds = Math.round((Date.now() - started) / 1000);
        status.textContent = `正在启动 Harness…（${seconds}s）`;
      }, 1000);

      window.__dshFailed = (message) => {
        clearInterval(timer);
        root.classList.add("failed");
        status.textContent = "Harness 启动失败";
        detail.textContent = message;
        detail.classList.add("on");
      };
    </script>
  </body>
</html>
